# GRIDGO web portal — the compose file that runs on the captain's server.
#
# Install to ~/gridgo/web/docker-compose.yml. That path is what
# ~/gridgo/bin/deploy.sh (the single command the CI deploy key may run) enters
# before `docker compose pull && docker compose up -d --remove-orphans`.
#
# See docs/DEPLOYMENT.md for installation, rollback, and verification.

name: gridgo-web

services:
  web:
    image: ghcr.io/gridgoph/gridgo-web:${GRIDGO_WEB_TAG:-latest}

    # The edge proxy resolves this exact name on the gridgo-edge network:
    #   gridgo-dash.talasora.com  ->  reverse_proxy gridgo-web:3000
    # Renaming it takes the portal off the internet.
    container_name: gridgo-web

    restart: unless-stopped

    # No `ports:`. The portal is reachable only through the proxy on the shared
    # network — nothing is published on the host, so the container cannot
    # collide with anything already bound to host :3000.
    expose:
      - "3000"

    environment:
      NODE_ENV: production
      # Where the standalone server listens inside the container. The API URL is
      # NOT here on purpose: NEXT_PUBLIC_* is compiled into the browser bundle at
      # image build time, so setting it at runtime would change nothing and only
      # suggest, falsely, that it could be changed without a rebuild.
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Clerk middleware verifies every portal request server-side. Provision
      # this in the compose directory's gitignored `.env`; never bake it into
      # the image or expose it through NEXT_PUBLIC_*.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?CLERK_SECRET_KEY is required}

    # Inherited from the image's HEALTHCHECK (see Dockerfile) — declared here so
    # an operator reading only this file knows the container has one and where
    # it points.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    # Container logs are the only record of a crash loop; unbounded they fill the
    # disk that also holds the API's store.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - gridgo-edge

networks:
  # Created and owned by ~/gridgo-proxy (Caddy). Declared external so a
  # `docker compose down` here can never delete the network the API and the
  # landing site also sit on.
  gridgo-edge:
    name: gridgo-edge
    external: true
